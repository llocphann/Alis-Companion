name: Alis-Companion documentation governance

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'to-do/**'
      - 'scripts/test-doc-governance.py'
      - '.github/workflows/documentation-governance.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'to-do/**'
      - 'scripts/test-doc-governance.py'
      - '.github/workflows/documentation-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check issue redirects, immutable archives and links
        run: python3 scripts/test-doc-governance.py
