  push:
    branches: [main]
    paths:
      - 'scripts/aqua-shader-ab.py'
      - 'scripts/aqua-g1-resource-sample.py'
      - 'scripts/aqua-companion-voice-eval.py'
      - 'services/AquaReplyGuard.js'
      - 'scripts/aqua/reply_guard.py'
      - 'scripts/aqua/memory_store.py'
      - 'scripts/test-aqua-memory-store.py'
      - 'scripts/aqua-proactive-policy-prototype.js'
      - 'scripts/test-aqua-proactive-policy.cjs'
      - 'modules/abyss/companion/AquaBehaviorDirector.js'
      - 'scripts/test-aqua-behavior-director.cjs'
      - 'services/AquaPersona.js'
      - 'scripts/aqua/persona.py'
      - 'scripts/test-aqua-local-persona.py'
      - 'scripts/test-aqua-persona.cjs'
      - 'scripts/aqua/local_mind.py'
      - 'scripts/test-aqua-reply-guard-local.py'
      - 'services/AquaMind.qml'
      - 'scripts/test-aqua-reply-guard.cjs'
      - 'scripts/test-aqua-companion-voice-eval.py'
      - 'scripts/fixtures/alis-companion-voice-scenarios.json'
      - 'scripts/test-aqua-g1-resource-contract.py'
      - 'scripts/aqua-g1-compare.py'
      - 'scripts/test-aqua-g1-compare-contract.py'
      - 'scripts/aqua-shader-ab-sequence.py'
      - 'scripts/test-aqua-shader-ab-contract.py'
      - 'scripts/test-aqua-shader-sequence-contract.py'
      - 'scripts/build-aqua-material-candidate.py'
      - 'modules/abyss/companion/WaterDropletMaterial.frag'
      - 'modules/abyss/companion/OctoTentacle.frag'
      - 'modules/abyss/companion/WaterDropletContact.frag'
      - '.github/workflows/alis-companion-shader-offline.yml'
  pull_request:
    paths:
      - 'scripts/aqua-shader-ab.py'
      - 'scripts/aqua-g1-resource-sample.py'
      - 'scripts/aqua-companion-voice-eval.py'
      - 'services/AquaReplyGuard.js'
      - 'scripts/aqua/reply_guard.py'
      - 'scripts/aqua/memory_store.py'
      - 'scripts/test-aqua-memory-store.py'
      - 'scripts/aqua-proactive-policy-prototype.js'
      - 'scripts/test-aqua-proactive-policy.cjs'
      - 'modules/abyss/companion/AquaBehaviorDirector.js'
      - 'scripts/test-aqua-behavior-director.cjs'
      - 'services/AquaPersona.js'
      - 'scripts/aqua/persona.py'
      - 'scripts/test-aqua-local-persona.py'
      - 'scripts/test-aqua-persona.cjs'
      - 'scripts/aqua/local_mind.py'
      - 'scripts/test-aqua-reply-guard-local.py'
      - 'services/AquaMind.qml'
      - 'scripts/test-aqua-reply-guard.cjs'
      - 'scripts/test-aqua-companion-voice-eval.py'
      - 'scripts/fixtures/alis-companion-voice-scenarios.json'
      - 'scripts/test-aqua-g1-resource-contract.py'
      - 'scripts/aqua-g1-compare.py'
      - 'scripts/test-aqua-g1-compare-contract.py'
      - 'scripts/aqua-shader-ab-sequence.py'
      - 'scripts/test-aqua-shader-ab-contract.py'
      - 'scripts/test-aqua-shader-sequence-contract.py'
      - 'scripts/build-aqua-material-candidate.py'
      - 'modules/abyss/companion/WaterDropletMaterial.frag'
      - 'modules/abyss/companion/OctoTentacle.frag'
      - 'modules/abyss/companion/WaterDropletContact.frag'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              'scripts/aqua-shader-ab.py',
              'scripts/aqua-g1-resource-sample.py',
              'scripts/aqua-companion-voice-eval.py',
              'scripts/aqua/reply_guard.py',
              'scripts/aqua/memory_store.py',
              'scripts/test-aqua-memory-store.py',
              'scripts/aqua/local_mind.py',
              'scripts/aqua/persona.py',
              'scripts/test-aqua-local-persona.py',
              'scripts/test-aqua-reply-guard-local.py',
              'scripts/test-aqua-companion-voice-eval.py',
              'scripts/test-aqua-g1-resource-contract.py',
              'scripts/aqua-g1-compare.py',
              'scripts/test-aqua-g1-compare-contract.py',
              'scripts/aqua-shader-ab-sequence.py',
              'scripts/test-aqua-shader-ab-contract.py',
              'scripts/test-aqua-shader-sequence-contract.py',
              'scripts/build-aqua-material-candidate.py',
          ]:
              ast.parse(Path(path).read_text(encoding='utf-8'), filename=path)
              print('SYNTAX_OK', path)
          PY
      - name: Run offline proof contracts (no GPU required)
        run: |
          python3 scripts/test-aqua-shader-ab-contract.py
          python3 scripts/test-aqua-shader-sequence-contract.py
          python3 scripts/test-aqua-g1-resource-contract.py
          python3 scripts/test-aqua-g1-compare-contract.py
          python3 scripts/test-aqua-companion-voice-eval.py
          node scripts/test-aqua-reply-guard.cjs
          python3 scripts/test-aqua-reply-guard-local.py
          python3 scripts/test-aqua-memory-store.py
          node scripts/test-aqua-proactive-policy.cjs
          node scripts/test-aqua-behavior-director.cjs
          node scripts/test-aqua-persona.cjs
          python3 scripts/test-aqua-local-persona.py
      - name: Check immutable candidate build and exact source
        run: |
          python3 - <<'PY'
          import subprocess, sys, tempfile
          from pathlib import Path
          source = Path('modules/abyss/companion/WaterDropletMaterial.frag').read_bytes()
          with tempfile.TemporaryDirectory(prefix='alis-companion-candidate-contract-') as temp:
              dst = Path(temp) / 'candidate.frag'
              cmd = [sys.executable, 'scripts/build-aqua-material-candidate.py', str(dst)]
              first = subprocess.run(cmd, capture_output=True, text=True)
              assert first.returncode == 0, first.stderr
              candidate = dst.read_bytes()
              assert candidate != source
              assert b'if(along<0.0 || along>travel) continue;' in candidate
              assert source == Path('modules/abyss/companion/WaterDropletMaterial.frag').read_bytes()
              second = subprocess.run(cmd, capture_output=True, text=True)
              assert second.returncode != 0
              assert dst.read_bytes() == candidate
          print('CANDIDATE_SOURCE_ONLY_NO_OVERWRITE_PASS')
          PY

  compile-shaders:
    name: QSB bake portability smoke (not GPU acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt shader baker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-shader-baker qt6-declarative-dev-tools
      - name: Parse changed Companion QML without starting any desktop
        run: |
          set -euo pipefail
          QMLFORMAT="$(command -v qmlformat || true)"
          if [ -z "$QMLFORMAT" ]; then QMLFORMAT=/usr/lib/qt6/bin/qmlformat; fi
          test -x "$QMLFORMAT"
          "$QMLFORMAT" services/AquaMind.qml >/dev/null
          "$QMLFORMAT" HadalisSession.qml >/dev/null
          echo "ALIS_COMPANION_QML_PARSE_SMOKE_PASS (Qt syntax only; not live import/integration)"
      - name: Independently bake baseline, bubble candidate and deliberately changed shader
        run: |
          set -euo pipefail
          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          test -x "$QSB"
          "$QSB" --version
          export QSB
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import subprocess, tempfile, hashlib, os
          root = Path.cwd()
          shader = root / "modules/abyss/companion/WaterDropletMaterial.frag"
          spec = importlib.util.spec_from_file_location("shader_ab", root / "scripts/aqua-shader-ab.py")
          ab = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ab)
          with tempfile.TemporaryDirectory(prefix="alis-companion-qsb-") as tmp:
              wd = Path(tmp)
              baseline = wd / "baseline.frag"
              negative = wd / "negative.frag"
              candidate = wd / "candidate.frag"
              baseline.write_bytes(shader.read_bytes())
              negative.write_text(ab.negative_variant(shader.read_text()), encoding="utf-8")
              subprocess.run(["python3", "scripts/build-aqua-material-candidate.py", str(candidate)], check=True)
              flags = ab.qsb_flags(os.environ["QSB"])
              print("QSB_SMOKE_FLAGS", flags)
              hashes = {}
              for name, src in (("baseline", baseline), ("negative", negative), ("candidate", candidate)):
                  qsb = wd / (name + ".frag.qsb")
                  subprocess.run([os.environ["QSB"], *flags, "-o", str(qsb), str(src)], check=True)
                  data = qsb.read_bytes()
                  assert data
                  dump = subprocess.check_output([os.environ["QSB"], "-d", str(qsb)])
                  assert dump, name
                  hashes[name] = hashlib.sha256(data).hexdigest()
                  print("QSB_SMOKE_BAKED", name, "SHA256", hashes[name])
              assert hashes["baseline"] != hashes["negative"]
              for filename in ("OctoTentacle.frag", "WaterDropletContact.frag"):
                  src = root / "modules/abyss/companion" / filename
                  qsb = wd / (filename + ".qsb")
                  subprocess.run([os.environ["QSB"], *flags, "-o", str(qsb), str(src)], check=True)
                  assert qsb.is_file() and qsb.stat().st_size > 0
                  subprocess.check_output([os.environ["QSB"], "-d", str(qsb)])
                  print("QSB_SMOKE_OWNED", filename, hashlib.sha256(qsb.read_bytes()).hexdigest())
              print("QSB_SMOKE_PASS baseline/negative/bubble-candidate/Octo/contact compiled independently")
          PY
