[workspace]
resolver = "2"
members = ["alis-companiond"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
version = "1.0.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
